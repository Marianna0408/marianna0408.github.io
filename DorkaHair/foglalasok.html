<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Időpontfoglalás | Dorka Hair</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><a href="index.html" class="logo">DORKA HAIR</a></header>
    <main class="container">
        <div class="title-center">
            <h2>Foglalj időpontot</h2>
            <p>Várlak szeretettel zamárdi szalonomba!</p>
        </div>

        <div style="max-width: 600px; margin: auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
            <form>
                <input type="text" placeholder="Teljes neved" required>
                <input type="tel" placeholder="Telefonszámod" required>
                <label>Válaszd ki a szolgáltatást:</label>
                <select style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd;">
                    <option>Női hajvágás</option>
                    <option>Férfi hajvágás</option>
                    <option>Festés / Balayage</option>
                    <option>Joico újraépítés</option>
                </select>
                
                <div class="checkbox-row">
                    <input type="checkbox" id="aszf" required>
                    <label for="aszf">Elolvastam és elfogadom az <a href="aszf.html" target="_blank" style="color:var(--gold)">Általános Szerződési Feltételeket</a>.</label>
                </div>
                
                <button type="submit" class="btn-gold" style="width: 100%;">Foglalási szándék küldése</button>
            </form>
            <p style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: #666;">
                Vagy hívj közvetlenül: <br>
                <strong>+36 30 123 4567</strong>
            </p>
        </div>
    </main>
</body>
</html>
